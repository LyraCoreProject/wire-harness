name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the pinned toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Test adapter arguments
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Syntax-check the adapter scripts
        shell: bash
        run: |
          for f in adapters/*/*.sh; do bash -n "$f" || exit 1; done
          echo "bash -n clean on $(ls adapters/*/*.sh | wc -l) adapter scripts"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show the pinned toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Cache cargo registry + coverage target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target/llvm-cov-target
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: coverage-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --version || cargo install cargo-llvm-cov --locked

      - name: Measure
        run: cargo llvm-cov --locked --no-report

      - name: Report
        run: |
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --html --output-dir target/coverage

      - name: Enforce the floors
        run: |
          cargo llvm-cov report --summary-only \
            --fail-under-lines 25 --fail-under-regions 25 --fail-under-functions 25

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14
