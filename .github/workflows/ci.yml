name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Cache cargo registry + target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Test adapter arguments
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Syntax-check the adapter scripts
        shell: bash
        run: |
          for f in adapters/*/*.sh; do bash -n "$f" || exit 1; done
          echo "bash -n clean on $(ls adapters/*/*.sh | wc -l) adapter scripts"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Show the pinned toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Cache cargo registry + coverage target dir
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            target/llvm-cov-target
          key: coverage-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: coverage-${{ runner.os }}-

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --version || cargo install cargo-llvm-cov --locked

      - name: Measure
        run: cargo llvm-cov --locked --no-report

      - name: Report
        run: |
          cargo llvm-cov report --summary-only
          cargo llvm-cov report --html --output-dir target/coverage

      - name: Enforce the floors
        run: |
          cargo llvm-cov report --summary-only \
            --fail-under-lines 25 --fail-under-regions 25 --fail-under-functions 25

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: target/coverage/
          if-no-files-found: error
          retention-days: 14

  tag-conformance:
    name: Tag conformance change
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: conformance-tag-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if [ -n "$(git tag --points-at "$COMMIT" -l 'v0.2.0-conformance.*')" ]; then
            echo 'This commit already has a conformance tag'
            exit 0
          fi
          latest=$(git tag -l 'v0.2.0-conformance.*' --sort=-version:refname | head -n 1)
          [[ "$latest" =~ ^v0\.2\.0-conformance\.([0-9]+)$ ]]
          if ! git merge-base --is-ancestor "$latest^{commit}" "$COMMIT"; then
            echo "$COMMIT does not descend from $latest; skipping older run"
            exit 0
          fi
          if git diff --quiet "$latest^{commit}" "$COMMIT" -- scenarios/ traces/ src/ adapters/ Cargo.toml Cargo.lock; then
            echo "No conformance inputs changed since $latest"
            exit 0
          fi
          next="v0.2.0-conformance.$((BASH_REMATCH[1] + 1))"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$next" -f "sha=$COMMIT"
