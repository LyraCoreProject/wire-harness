broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 420, path = ["stock"], value = { type = "unsigned", value = 0 }, count = 1 },
  { opcode = 358, path = ["count"], value = { type = "unsigned", value = 10 }, count = 1 },
