schema_version = 3
id = "vendor_offers"
behavior = "vendor_offers"

[opening]
window_ms = 1000

[rules]
time_tolerance_ms = 100
wall_clock_tolerance_ms = 2000

[rules.character_scope]
name = "character_vendor_offers"
reason = "Retain every Character field; nearby creature and item object bodies are independent of the offer list."
packets = []

[[fixtures]]
verb = "character"
name = "Vendoroffers"
race = "human"
class = "warrior"
level = 1
at = { map = 0, x = -8949.95, y = -132.493, z = 83.5312, orientation = 0.0 }

[[fixtures]]
verb = "money"
copper = 6000

[[fixtures]]
verb = "creature"
id = "barkeep"
entry = 9499
offset = 2.0

[[fixtures]]
verb = "creature"
id = "alchemist"
entry = 11188
offset = -2.0

[[rules.identities]]
name = "purchased_stack_guid"
reason = "The backpack link is an allocated item GUID low word. Identity consistency is unchecked: single sample."
opcode = 169
path = ["objects", "0", "values", "field_536"]

[[steps]]
id = "condition_list"
send = { opcode = "CMSG_LIST_INVENTORY", target = { fixture = "alchemist" } }
[steps.checkpoint]
window_ms = 500
replies = [415]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 415, path = ["items", "0", "entry"], value = { type = "unsigned", value = 3371 }, count = 1 },
]

[[rules.unexpected_packets]]
name = "ambient_movement_condition_list"
reason = "Nearby creature movement is independent of vendor offers."
checkpoint = "condition_list"
opcode = 221
subject_guid_high = 61744

[[steps]]
id = "condition_refusal"
send = { opcode = "CMSG_BUY_ITEM", target = { fixture = "alchemist" }, entry = 14526, count = 1 }
[steps.checkpoint]
window_ms = 500
replies = [421]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 421, path = ["reason"], value = { type = "unsigned", value = 0 }, count = 1 },
]

[[rules.unexpected_packets]]
name = "ambient_movement_condition_refusal"
reason = "Nearby creature movement is independent of vendor offers."
checkpoint = "condition_refusal"
opcode = 221
subject_guid_high = 61744

[[steps]]
id = "stock_list"
send = { opcode = "CMSG_LIST_INVENTORY", target = { fixture = "barkeep" } }
[steps.checkpoint]
window_ms = 500
replies = [415]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 415, path = ["items", "1", "entry"], value = { type = "unsigned", value = 11325 }, count = 1 },
  { opcode = 415, path = ["items", "1", "stock"], value = { type = "unsigned", value = 10 }, count = 1 },
]

[[rules.unexpected_packets]]
