schema_version = 3
id = "quest_reward"
behavior = "quest_reward"

[opening]
window_ms = 1000

[rules]
time_tolerance_ms = 100
wall_clock_tolerance_ms = 2000

[rules.character_scope]
name = "character_quest_reward"
reason = "Retain every Character field, including XP and inventory links; nearby creatures and item bodies are outside the reward transaction."
packets = []

[[fixtures]]
verb = "character"
name = "Questreward"
race = "dwarf"
class = "warrior"
level = 1
at = { map = 0, x = -6240.32, y = 331.033, z = 382.758, orientation = 0.0 }

[[fixtures]]
verb = "money"
copper = 0

[[fixtures]]
verb = "creature"
id = "giver"
entry = 6774
offset = 2.0

[[fixtures]]
verb = "creature"
id = "innkeeper"
entry = 295
offset = -2.0

[[rules.identities]]
name = "reward_stack_guid"
reason = "The backpack link is an allocated item GUID low word. Identity consistency is unchecked: single sample."
opcode = 169
path = ["objects", "0", "values", "field_536"]

[[steps]]
id = "wrong_giver"
send = { opcode = "CMSG_QUESTGIVER_ACCEPT_QUEST", target = { fixture = "innkeeper" }, entry = 2158 }
[steps.checkpoint]
window_ms = 500
replies = [382]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
]

