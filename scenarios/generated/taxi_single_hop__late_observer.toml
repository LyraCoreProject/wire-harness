[[rules.clocks]]
name = "landing_clock_origin"
opcode = 199
path = ["timestamp"]
reason = "Require an unsigned 32-bit timestamp. Process clock origins differ; elapsed-clock consistency is unchecked: single sample. Future samples compare within one 100 ms map tick; landing delivery has its own rule."
tolerance_ms = 100

[[rules.clocks]]
name = "create_clock"
opcode = 169
path = [
    "objects",
    "0",
    "movement",
    "timestamp",
]
reason = "CREATE timestamps use the process clock. Clock consistency is unchecked: single sample."
tolerance_ms = 250

[[rules.clocks]]
character = "viewer"
name = "viewer_teleport_clock"
opcode = 197
path = ["timestamp"]
reason = "The viewer's teleport timestamps use the Reference Server process clock. Compare their elapsed time within one 100 ms map tick."
tolerance_ms = 100

[[rules.data_fields]]
name = "zone_world_state_catalogue"
opcode = 706
path = ["states"]
reason = "The state ids and values depend on the world's event catalogue. Compare packet count, order, delivery time, map and zone; allow this catalogue's contents to differ."

[[rules.data_fields]]
name = "zone_weather_type"
opcode = 756
path = ["weather_type"]
reason = "The weather type depends on the zone's current weather, independently of this flight. Packet count, order, delivery time and the instant-change flag remain checked."

[[rules.data_fields]]
name = "zone_weather_sound"
opcode = 756
path = ["sound"]
reason = "The weather sound id follows the independently selected weather type and intensity."

[[rules.identities]]
name = "spline_identity"
opcode = 221
path = ["spline_id"]
reason = "Require unsigned 32-bit spline ids and preserve a bijection across samples. The number is a server-local sequence, not elapsed time. Identity consistency is unchecked: single sample."

[[rules.identities]]
name = "teleport_counter"
opcode = 199
path = ["counter"]
reason = "Require an unsigned 32-bit counter, including zero. Counters belong to each connection; identity consistency is unchecked: single sample. The runner echoes the received counter."

[[rules.identities]]
name = "create_guid_word"
opcode = 169
path = [
    "objects",
    "0",
    "values",
    "field_0",
]
reason = "CREATE field_0 repeats the server-assigned Character GUID word. Identity consistency is unchecked: single sample."

[[rules.identities]]
name = "create_spline_id"
opcode = 169
path = [
    "objects",
    "0",
    "movement",
    "spline_id",
]
reason = "A moving CREATE carries a server-local spline id. Identity consistency is unchecked: single sample."

[[rules.packet_timing]]
name = "landing_delivery"
opcode = 199
reason = "Landing follows a scheduled flight-end tick. 150 ms covers one configured 100 ms map tick plus 50 ms of local delivery jitter; the advertised spline duration still has its separate 1 ms limit."
tolerance_ms = 150

[[rules.packet_timing]]
name = "passenger_update_delivery"
opcode = 169
reason = "Each passenger field retains its arrival time from activation. 150 ms covers one 100 ms map tick plus 50 ms local delivery jitter; fare and mount changes must occur at takeoff or landing as recorded."
tolerance_ms = 150

[[rules.packet_timing]]
name = "zone_world_states_delivery"
opcode = 706
reason = "The Reference Server polls zone changes every 1000 ms. 1150 ms covers that polling phase, one 100 ms map tick and 50 ms local delivery jitter. Count, order, map and zone remain exact. See docs/taxi.md for the pinned source."
tolerance_ms = 1150

[[rules.packet_timing]]
name = "zone_weather_delivery"
opcode = 756
reason = "Weather follows the same 1000 ms zone poll as world states. 1150 ms covers polling phase, one 100 ms map tick and 50 ms local delivery jitter. See docs/taxi.md for the pinned source."
tolerance_ms = 1150

[[rules.packet_timing]]
name = "passenger_zone_flags_delivery"
opcode = 169
path = [
    "objects",
    "0",
    "values",
    "field_190",
]
reason = "PLAYER_FLAGS VALUES updates follow the capital's resting area. The 1000 ms zone poll plus one 100 ms update tick and 50 ms local jitter gives 1150 ms. Its value remains exact; CREATE, fare, mount and unit-flags updates keep their 150 ms bound. See docs/taxi.md."
tolerance_ms = 1150
values_only = true

[[rules.packet_timing]]
character = "actor"
creates_only = true
name = "actor_create_delivery"
opcode = 169
path = [
    "objects",
