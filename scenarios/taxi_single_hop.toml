# Read docs/taxi.md for node and packet evidence before changing this scenario.
schema_version = 3
id = "taxi_single_hop"
behavior = "taxi_single_hop"

[opening]
window_ms = 1000

[rules]
# Duration is integer milliseconds; 1 ms covers final rounding of a float spline-length sum.
time_tolerance_ms = 1
# Wall-clock fields occur only in the opening phase of this scenario.
wall_clock_tolerance_ms = 2000

[rules.character_scope]
name = "passenger_and_taxi_state"
reason = "Nearby entities depend on world data. Keep packets naming the passenger as source or target. Compare every passenger field, preserving each field's changes and received times across packet batching."
packets = [
  { opcode = 221, paths = [["guid"]] },
  { opcode = 170, paths = [["guid"]] },
  { opcode = 533, paths = [["guid"]] },
  { opcode = 259, paths = [["guid"]] },
  { opcode = 305, paths = [["caster"], ["targets"]] },
  { opcode = 306, paths = [["caster"], ["targets"], ["hits"], ["misses"]] },
  { opcode = 316, paths = [["guid"]] },
  { opcode = 323, paths = [["attacker"], ["victim"]] },
  { opcode = 324, paths = [["attacker"], ["victim"]] },
  { opcode = 769, paths = [["guid"]] },
  { opcode = 781, paths = [["guid"]] },
  { opcode = 782, paths = [["guid"]] },
]

[[rules.identities]]
name = "spline_identity"
reason = "Require unsigned 32-bit spline ids and preserve a bijection across samples. The number is a server-local sequence, not elapsed time. Identity consistency is unchecked: single sample."
opcode = 221
path = ["spline_id"]

[[fixtures]]
verb = "character"
name = "Taxirider"
race = "human"
class = "warrior"
level = 1
at = { map = 0, x = -8840.56, y = 489.7, z = 109.61, orientation = 0.0 }

[[fixtures]]
verb = "money"
copper = 1000

[[fixtures]]
verb = "known_flight_node"
node_id = 2

[[fixtures]]
verb = "known_flight_node"
node_id = 4

[[fixtures]]
verb = "creature"
id = "flight_master"
entry = 352
offset = 2.0

[[steps]]
id = "status"
send = { opcode = "CMSG_TAXINODE_STATUS_QUERY", target = { fixture = "flight_master" } }
[steps.checkpoint]
window_ms = 250
replies = [427]
broadcasts = [{ opcode = 221, stream = "movement" }, { opcode = 169, stream = "values" }]
expect = [
  { opcode = 427, path = ["known"], value = { type = "unsigned", value = 1 }, count = 1 },
]

[[steps]]
id = "nodes"
send = { opcode = "CMSG_TAXIQUERYAVAILABLENODES", target = { fixture = "flight_master" } }
[steps.checkpoint]
window_ms = 250
replies = [425]
broadcasts = [{ opcode = 221, stream = "movement" }, { opcode = 169, stream = "values" }]
expect = [
  { opcode = 425, path = ["node"], value = { type = "unsigned", value = 2 }, count = 1 },
  { opcode = 425, path = ["known_nodes", "0"], value = { type = "unsigned", value = 10 }, count = 1 },
]

[[steps]]
id = "flight"
send = { opcode = "CMSG_ACTIVATETAXI", target = { fixture = "flight_master" }, source = 2, destination = 4 }
[steps.checkpoint]
window_ms = 80000
replies = [334, 430, 366, 221, 367, 334, 199]
broadcasts = [
  { opcode = 169, stream = "values" },
  { opcode = 706, stream = "zones" },
  { opcode = 756, stream = "zones" },
  { opcode = 305, stream = "spells" },
  { opcode = 306, stream = "spells" },
  { opcode = 259, stream = "emotes" },
  { opcode = 170, stream = "entities" },
  { opcode = 533, stream = "entities" },
  { opcode = 316, stream = "combat" },
  { opcode = 323, stream = "combat" },
  { opcode = 324, stream = "combat" },
  { opcode = 769, stream = "movement_modes" },
  { opcode = 781, stream = "movement_modes" },
  { opcode = 782, stream = "movement_modes" },
]
expect = [
  { opcode = 430, path = ["result"], value = { type = "unsigned", value = 0 }, count = 1 },
  { opcode = 199, path = ["flags"], value = { type = "unsigned", value = 0 }, count = 1 },
  { opcode = 169, path = ["objects", "0", "values", "field_133"], value = { type = "unsigned", value = 0 }, count = 1 },
  { opcode = 169, path = ["objects", "0", "values", "field_1176"], value = { type = "unsigned", value = 890 }, count = 1 },
]

[[rules.clocks]]
name = "landing_clock_origin"
reason = "Require an unsigned 32-bit timestamp. Process clock origins differ; elapsed-clock consistency is unchecked: single sample. Future samples compare within one 100 ms map tick; landing delivery has its own rule."
opcode = 199
path = ["timestamp"]
tolerance_ms = 100

[[rules.identities]]
name = "teleport_counter"
reason = "Require an unsigned 32-bit counter, including zero. Counters belong to each connection; identity consistency is unchecked: single sample. The runner echoes the received counter."
opcode = 199
path = ["counter"]

[[rules.packet_timing]]
name = "landing_delivery"
reason = "Landing follows a scheduled flight-end tick. 150 ms covers one configured 100 ms map tick plus 50 ms of local delivery jitter; the advertised spline duration still has its separate 1 ms limit."
opcode = 199
tolerance_ms = 150

[[rules.packet_timing]]
name = "passenger_update_delivery"
reason = "Each passenger field retains its arrival time from activation. 150 ms covers one 100 ms map tick plus 50 ms local delivery jitter; fare and mount changes must occur at takeoff or landing as recorded."
opcode = 169
tolerance_ms = 150

[[rules.packet_timing]]
name = "zone_world_states_delivery"
reason = "The Reference Server polls zone changes every 1000 ms. 1150 ms covers that polling phase, one 100 ms map tick and 50 ms local delivery jitter. Count, order, map and zone remain exact. See docs/taxi.md for the pinned source."
opcode = 706
tolerance_ms = 1150

[[rules.packet_timing]]
name = "zone_weather_delivery"
reason = "Weather follows the same 1000 ms zone poll as world states. 1150 ms covers polling phase, one 100 ms map tick and 50 ms local delivery jitter. See docs/taxi.md for the pinned source."
opcode = 756
tolerance_ms = 1150

[[rules.packet_timing]]
name = "passenger_zone_flags_delivery"
reason = "PLAYER_FLAGS changes when the passenger leaves the capital's resting area. The 1000 ms zone poll plus one 100 ms update tick and 50 ms local jitter gives 1150 ms. Its value remains exact; fare, mount and unit-flags updates keep their 150 ms bound. See docs/taxi.md."
opcode = 169
path = ["objects", "0", "values", "field_190"]
tolerance_ms = 1150

[[rules.data_fields]]
name = "zone_world_state_catalogue"
reason = "The state ids and values depend on the world's event catalogue. Compare packet count, order, delivery time, map and zone; allow this catalogue's contents to differ."
opcode = 706
path = ["states"]

[[rules.data_fields]]
name = "zone_weather_type"
reason = "The weather type depends on the zone's current weather, independently of this flight. Packet count, order, delivery time and the instant-change flag remain checked."
opcode = 756
path = ["weather_type"]

[[rules.random]]
name = "zone_weather_grade"
reason = "Weather intensity varies independently of the flight. Both samples must be finite floats between 0 and 1."
opcode = 756
path = ["grade"]
range = { type = "float", minimum = 0.0, maximum = 1.0 }

[[rules.data_fields]]
name = "zone_weather_sound"
reason = "The weather sound id follows the independently selected weather type and intensity."
opcode = 756
path = ["sound"]
