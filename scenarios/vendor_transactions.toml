send = { opcode = "CMSG_BUY_ITEM", target = { fixture = "vendor" }, entry = 2320, count = 1 }
[steps.checkpoint]
window_ms = 500
replies = [420, 358]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 169, path = ["objects", "0", "values", "field_1176"], value = { type = "unsigned", value = 0 }, count = 1 },
  { opcode = 358, path = ["entry"], value = { type = "unsigned", value = 2320 }, count = 1 },
  { opcode = 358, path = ["count"], value = { type = "unsigned", value = 1 }, count = 1 },
]

[[rules.unexpected_packets]]
