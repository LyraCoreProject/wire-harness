schema_version = 3
id = "vendor_transactions"
behavior = "vendor_transactions"

[opening]
window_ms = 1000

[rules]
time_tolerance_ms = 100
wall_clock_tolerance_ms = 2000

[rules.character_scope]
name = "character_vendor_state"
reason = "Compare every Character field, including money and inventory links; item object bodies and unrelated creatures are outside this transaction scenario."
packets = []

[[fixtures]]
verb = "character"
name = "Vendorbuyer"
race = "human"
class = "warrior"
level = 1
at = { map = 0, x = -8949.95, y = -132.493, z = 83.5312, orientation = 0.0 }

[[fixtures]]
verb = "money"
copper = 10

[[fixtures]]
verb = "item"
id = "linen"
entry = 2589
count = 2

[[fixtures]]
verb = "creature"
id = "vendor"
entry = 66
offset = 2.0

[[steps]]
id = "browse"
send = { opcode = "CMSG_LIST_INVENTORY", target = { fixture = "vendor" } }
[steps.checkpoint]
window_ms = 500
replies = [415]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 415, path = ["items", "0", "entry"], value = { type = "unsigned", value = 7005 }, count = 1 },
]

[[rules.unexpected_packets]]
name = "ambient_movement_browse"
reason = "Nearby creature movement is independent of vendor transactions."
checkpoint = "browse"
opcode = 221
subject_guid_high = 61744

[[steps]]
id = "too_little_money"
send = { opcode = "CMSG_BUY_ITEM", target = { fixture = "vendor" }, entry = 2320, count = 2 }
[steps.checkpoint]
window_ms = 500
replies = [421]
broadcasts = [{ opcode = 169, stream = "values" }]
expect = [
  { opcode = 421, path = ["reason"], value = { type = "unsigned", value = 2 }, count = 1 },
]

[[rules.unexpected_packets]]
name = "ambient_movement_too_little_money"
