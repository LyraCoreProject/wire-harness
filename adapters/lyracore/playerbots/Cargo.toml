[workspace]

[package]
name = "lyracore-playerbots-acceptance"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[[bin]]
name = "vanilla-wire-playerbots"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wire-client = { path = "../../.." }
