# A one-crate workspace: this repository IS the harness. Declared explicitly so `cargo` never walks
# up out of the checkout looking for a parent workspace — which is exactly what would happen if you
# cloned this next to (or inside) a server repo that has one.
[workspace]
members = ["."]
resolver = "2"

[package]
name = "wire-client"
version = "0.1.0-alpha.1"
edition = "2021"
# The MSRV, deliberately older than rust-toolchain.toml's development pin: the widest range of
# rustc that can build this. Kept in step with LyraCore's workspace.package.rust-version.
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LyraCoreProject/wire-harness"
homepage = "https://github.com/LyraCoreProject/wire-harness"
description = "Headless WoW build-5875 (1.12.1) wire client: SRP6 logon, encrypted world session, decoded SMSG assertions. Server-agnostic."
keywords = ["wow", "vanilla", "protocol", "5875", "testing"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
# Not published to crates.io for the alpha: `wire-client` is a generic name we have no claim on and
# the release channel #246 consumes is a git tag, not a registry version. Flip when that changes.
publish = false
# The PACKAGE name stays `wire-client` — it is what `cargo build -p wire-client` and every
# orchestrator under adapters/ already say, and #244 shipped it. It is deliberately NOT
# `lyracore-*`: this is a SERVER-AGNOSTIC build-5875 harness that can test any core.
# Two binaries: name the default so a bare `cargo run` is unambiguous.
default-run = "vanilla-wire"

# Headless 1.12.1 (build 5875) wire client: speaks the real WoW protocol so tests can drive CMSG
# and assert on decoded SMSG (no wine client in the loop).
#
# STANDALONE BOUNDARY (#244): every dependency below is an EXTERNAL protocol crate. There is no
# path dependency on any server crate, and adding one is the thing that would make this tool
# un-usable against any other build-5875 server. If the client needs something a server crate has
# (an update-mask decoder, grid math), it gets its own independent implementation — see
# src/values_mask.rs and src/spatial.rs for why that is a feature and not duplication.

# `vanilla-wire`: the scenario driver. Path stays src/main.rs so the module tree is unchanged.
[[bin]]
name = "vanilla-wire"
path = "src/main.rs"

# `vanilla-wire-bench`: the synthetic-player capacity benchmark.
[[bin]]
name = "vanilla-wire-bench"
path = "src/bin/bench/main.rs"

[dependencies]
# The four gtker protocol crates are the ONLY protocol dependency, and their `wow_` names are
# upstream's — never rename them.
wow_srp = "0.7"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", features = ["vanilla", "sync"] }
# Only needed to name `FriendResult` (SMSG_FRIEND_STATUS's result field).
wow_world_base = "0.3"
anyhow = "1"
# `bench` (src/bin/bench) only: the capacity report is a serde struct + a Display.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
