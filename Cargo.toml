[package]
name = "wire-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
# NOT renamed to `lyracore-*` on purpose: #244–#246 extract this as a SERVER-AGNOSTIC standalone
# 1.12.1 wire harness that can test any core, so a LyraCore-branded name would be wrong for it.
# The capacity benchmark (issue #18) added a SECOND binary to this crate, which made the bare
# `cargo run -p wire-client` that ~6 test scripts use ambiguous — every one of them failed with
# "could not determine which binary to run". Name the default so those scripts keep working;
# the benchmark is reached explicitly via `--bin bench`.
default-run = "wire-client"

# Headless 1.12.1 (build 5875) wire test-client: speaks the real WoW protocol to the
# gateway so tests can drive CMSG and assert on decoded SMSG (no wine client in the loop).
# Reuses the SAME protocol crates the gateway depends on (gateway/Cargo.toml).

[dependencies]
lyracore-shared.workspace = true
wow_srp = "0.7"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", features = ["vanilla", "sync"] }
# Only needed to name `FriendResult` (SMSG_FRIEND_STATUS's result field) — see gateway/Cargo.toml.
wow_world_base = "0.3"
anyhow = "1"
# `bench` (src/bin/bench) only: the capacity report is a serde struct + a Display, and both
# versions are already in the workspace lockfile — no new dependency tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
