[package]
name = "wire-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Headless 1.12.1 (build 5875) wire test-client: speaks the real WoW protocol to the
# gateway so tests can drive CMSG and assert on decoded SMSG (no wine client in the loop).
# Reuses the SAME protocol crates the gateway depends on (gateway/Cargo.toml).

[dependencies]
game-shared.workspace = true
wow_srp = "0.7"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", features = ["vanilla", "sync"] }
# Only needed to name `FriendResult` (SMSG_FRIEND_STATUS's result field) — see gateway/Cargo.toml.
wow_world_base = "0.3"
anyhow = "1"
# `bench` (src/bin/bench) only: the capacity report is a serde struct + a Display, and both
# versions are already in the workspace lockfile — no new dependency tree.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
