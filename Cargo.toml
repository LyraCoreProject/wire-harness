[workspace]
members = ["."]
resolver = "2"

[package]
name = "wire-client"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LyraCoreProject/wire-harness"
homepage = "https://github.com/LyraCoreProject/wire-harness"
description = "Headless WoW build-5875 (1.12.1) wire client: SRP6 logon, encrypted world session, decoded SMSG assertions. Server-agnostic."
keywords = ["wow", "vanilla", "protocol", "5875", "testing"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"
publish = false
default-run = "vanilla-wire"

[lib]
name = "wire_client"
path = "src/lib.rs"

[[bin]]
name = "vanilla-wire"
path = "src/main.rs"

[[bin]]
name = "vanilla-wire-bench"
path = "src/bin/bench/main.rs"

[dependencies]
wow_srp = "0.7"
wow_login_messages = { version = "0.5", features = ["sync"] }
wow_world_messages = { version = "0.3", features = ["vanilla", "sync"] }
wow_world_base = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
